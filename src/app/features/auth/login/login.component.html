<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <span class="auth-card__icon">⚖</span>
      <h1>Welcome to LawStreet</h1>
      <p>Sign in to your account</p>
    </div>
    <div class="alert alert--error" *ngIf="error">{{ error }}</div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter your username" (keydown.enter)="login()" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Enter your password" (keydown.enter)="login()" />
        <button class="toggle-pw" type="button" (click)="showPassword = !showPassword">{{ showPassword ? '🙈' : '👁' }}</button>
      </div>
    </div>
    <button class="auth-submit-btn" (click)="login()" [disabled]="loading">
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>
    <div class="auth-card__footer">Don't have an account? <a routerLink="/auth/register">Register</a></div>
    <div class="auth-card__back"><a routerLink="/">← Back to Home</a></div>
  </div>
</div>
