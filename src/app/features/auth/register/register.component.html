<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <span class="auth-card__icon">⚖</span>
      <h1>Join LawStreet</h1>
      <p>Create your free account today</p>
    </div>
    <div class="alert alert--error"   *ngIf="error">{{ error }}</div>
    <div class="alert alert--success" *ngIf="success">Registration successful! Redirecting...</div>
    <div class="name-row">
      <div class="form-group"><label>First Name</label><input type="text" [(ngModel)]="form.firstName" placeholder="First name" /></div>
      <div class="form-group"><label>Last Name</label><input type="text" [(ngModel)]="form.lastName" placeholder="Last name" /></div>
    </div>
    <div class="form-group"><label>Username</label><input type="text" [(ngModel)]="form.username" placeholder="Choose a username" /></div>
    <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="form.email" placeholder="Your email address" /></div>
    <div class="form-group"><label>Password</label><input type="password" [(ngModel)]="form.password" placeholder="Create a strong password" /></div>
    <button class="auth-submit-btn" (click)="register()" [disabled]="loading || success">
      {{ loading ? 'Creating account...' : 'Create Account' }}
    </button>
    <div class="auth-card__footer">Already have an account? <a routerLink="/auth/login">Sign In</a></div>
  </div>
</div>
